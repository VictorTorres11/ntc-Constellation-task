name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  infra-pipeline:
    name: Infra / OIDC Role
    runs-on: ubuntu-latest

    outputs:
      role_arn: ${{ steps.tf-output.outputs.role_arn }}
      account_id: ${{ steps.account.outputs.id }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - run: terraform init
        working-directory: infra/pipeline

      - name: Apply
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="github_org=${{ secrets.GH_ORG }}" \
            -var="github_repo=ntc-Constellation-task" \
            -var="ecr_repository_name=${{ vars.ECR_REPOSITORY_NAME }}" \
            -var="ecs_execution_role_arn=arn:aws:iam::${{ steps.account.outputs.id }}:role/ntc-constellation-ecs-execution-role" \
            -var="ecs_task_role_arn=arn:aws:iam::${{ steps.account.outputs.id }}:role/ntc-constellation-ecs-task-role"
        working-directory: infra/pipeline

      - name: Get role ARN
        id: tf-output
        run: echo "role_arn=$(terraform output -raw github_actions_role_arn)" >> $GITHUB_OUTPUT
        working-directory: infra/pipeline

  infra-ecr:
    name: Infra / ECR
    runs-on: ubuntu-latest
    needs: [infra-pipeline]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.infra-pipeline.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init
        working-directory: infra/ecr

      - name: Apply
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="repository_name=${{ vars.ECR_REPOSITORY_NAME }}"
        working-directory: infra/ecr

  infra-ecs:
    name: Infra / ECS
    runs-on: ubuntu-latest
    needs: [infra-pipeline, infra-ecr]

    outputs:
      cluster_name: ${{ steps.tf-output.outputs.cluster_name }}
      listener_arn: ${{ steps.tf-output.outputs.listener_arn }}
      tg_blue_arn: ${{ steps.tf-output.outputs.tg_blue_arn }}
      tg_green_arn: ${{ steps.tf-output.outputs.tg_green_arn }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.infra-pipeline.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get ECR URL
        id: ecr
        run: |
          url=$(aws ecr describe-repositories \
            --repository-names "${{ vars.ECR_REPOSITORY_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --query "repositories[0].repositoryUri" --output text)
          echo "url=$url" >> $GITHUB_OUTPUT

      - run: terraform init
        working-directory: infra/ecs

      - name: Apply
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="ecr_repository_url=${{ steps.ecr.outputs.url }}"
        working-directory: infra/ecs

      - name: Get outputs
        id: tf-output
        run: |
          echo "cluster_name=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "listener_arn=$(terraform output -raw alb_listener_arn)" >> $GITHUB_OUTPUT
          echo "tg_blue_arn=$(terraform output -raw target_group_blue_arn)" >> $GITHUB_OUTPUT
          echo "tg_green_arn=$(terraform output -raw target_group_green_arn)" >> $GITHUB_OUTPUT
        working-directory: infra/ecs

  infra-monitoring:
    name: Infra / Monitoring
    runs-on: ubuntu-latest
    needs: [infra-pipeline, infra-ecs]

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.infra-pipeline.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init
        working-directory: infra/monitoring

      - name: Apply
        run: terraform apply -auto-approve -var="aws_region=${{ vars.AWS_REGION }}"
        working-directory: infra/monitoring

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: [infra-monitoring]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [secret-scan]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore app/aspnetapp.csproj

      - run: dotnet test app/aspnetapp.csproj --no-restore --verbosity normal

  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test, infra-ecs, infra-pipeline]

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.infra-pipeline.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG app/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-push, infra-ecs, infra-pipeline]

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.infra-pipeline.outputs.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Blue-green deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          PROJECT_NAME: ntc-constellation
          ECS_CLUSTER: ${{ needs.infra-ecs.outputs.cluster_name }}
          ALB_LISTENER_ARN: ${{ needs.infra-ecs.outputs.listener_arn }}
          TG_BLUE_ARN: ${{ needs.infra-ecs.outputs.tg_blue_arn }}
          TG_GREEN_ARN: ${{ needs.infra-ecs.outputs.tg_green_arn }}
        run: |
          chmod +x scripts/blue-green-deploy.sh
          ./scripts/blue-green-deploy.sh
